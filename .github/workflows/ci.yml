name: CI
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional Gradle test selector, e.g. ":spring-webmvc:test --tests FooTests" (runs on the spring-webmvc leg only)'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  ci:
    name: '${{ matrix.os.name}} | Java ${{ matrix.java.version}} | ${{ matrix.leg.name }}'
    runs-on: ${{ matrix.os.id }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - id: ubuntu-latest
            name: Linux
        java:
          - version: 8
            toolchain: false
        leg:
          - name: spring-webmvc
            artifact: true
            tasks: ':spring-webmvc:build'
          - name: spring-web
            artifact: false
            tasks: ':spring-web:check'
          - name: spring-webflux
            artifact: false
            tasks: ':spring-webflux:check'
          - name: core
            artifact: false
            tasks: ':spring-jcl:check :spring-core:check :spring-expression:check :spring-aop:check :spring-instrument:check'
          - name: beans-context
            artifact: false
            tasks: ':spring-beans:check :spring-context:check :spring-context-indexer:check :spring-context-support:check :spring-aspects:check'
          - name: data
            artifact: false
            tasks: ':spring-tx:check :spring-jdbc:check :spring-orm:check :spring-oxm:check :spring-r2dbc:check :spring-jms:check'
          - name: messaging
            artifact: false
            tasks: ':spring-messaging:check :spring-websocket:check'
          - name: test
            artifact: false
            tasks: ':spring-test:check :integration-tests:check'
    steps:
      - name: Prepare Windows runner
        if: ${{ runner.os == 'Windows' }}
        run: |
          git config --global core.autocrlf true
          git config --global core.longPaths true
          Stop-Service -name Docker
      - name: Check Out Code
        uses: actions/checkout@v4
      - name: Build
        id: build
        if: ${{ inputs.test-filter == '' || matrix.leg.artifact }}
        uses: ./.github/actions/build
        with:
          publish: true
          tasks: ${{ matrix.leg.tasks }}
          test-filter: ${{ inputs.test-filter }}
          java-version: ${{ matrix.java.version }}
          java-early-access: ${{ matrix.java.early-access || 'false' }}
          java-toolchain: ${{ matrix.java.toolchain }}
          develocity-access-key: ${{ secrets.GRADLE_ENTERPRISE_SECRET_ACCESS_KEY }}
      - name: Test Report
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/seal_test_report.py "${{ matrix.leg.name }}"
      - name: Upload JAR artifact
        if: ${{ matrix.leg.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.java.version }}-${{ matrix.os.name }}
          if-no-files-found: error
          path: |
            spring-webmvc/build/libs/spring-webmvc-*.jar
            !spring-webmvc/build/libs/spring-webmvc-*-sources.jar
            !spring-webmvc/build/libs/spring-webmvc-*-javadoc.jar
            !spring-webmvc/build/libs/spring-webmvc-*-test-fixtures.jar
